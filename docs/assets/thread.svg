<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A T3 Code thread: the user asks for an OpenBot agent, the T3 agent queues the task and ends its turn, and the tagged report arrives as a new message.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111726"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .who { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; fill: #6f7a90; }
    .msg { font-size: 16.5px; fill: #e6eaf2; }
    .dim { font-size: 14px; fill: #8d97ab; }
  </style>
  <rect width="1200" height="560" rx="24" fill="url(#bg2)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="23.5" fill="none" stroke="#242c3d"/>
  <!-- window bar -->
  <circle cx="44" cy="38" r="6" fill="#39435a"/><circle cx="66" cy="38" r="6" fill="#39435a"/><circle cx="88" cy="38" r="6" fill="#39435a"/>
  <text x="600" y="43" text-anchor="middle" class="dim">T3 Code thread</text>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#242c3d"/>

  <!-- user -->
  <text x="1140" y="112" text-anchor="end" class="who">YOU</text>
  <rect x="628" y="124" width="512" height="54" rx="14" fill="#2a2452" stroke="#3b3470"/>
  <text x="652" y="157" class="msg">Ask Ada in OpenBot to summarise today's inbox.</text>

  <!-- t3 agent -->
  <text x="60" y="222" class="who">T3 AGENT</text>
  <rect x="60" y="234" width="372" height="36" rx="8" fill="#171d2c" stroke="#2a3347"/>
  <circle cx="80" cy="252" r="4.5" fill="#9d8cff"/>
  <text x="96" y="257" class="mono" font-size="13.5" fill="#bdb2ff">send_message</text>
  <text x="212" y="257" class="mono" font-size="13.5" fill="#8d97ab">agent: "Ada"  →  queued</text>
  <text x="60" y="302" class="msg">Queued with Ada. The answer will arrive here.</text>

  <!-- divider -->
  <line x1="60" y1="344" x2="508" y2="344" stroke="#242c3d"/>
  <rect x="520" y="328" width="160" height="32" rx="16" fill="#171d2c" stroke="#2a3347"/>
  <text x="600" y="349" text-anchor="middle" class="dim">a moment later</text>
  <line x1="692" y1="344" x2="1140" y2="344" stroke="#242c3d"/>

  <!-- report -->
  <text x="60" y="394" class="who">NEW MESSAGE IN THE SAME THREAD</text>
  <rect x="60" y="406" width="1080" height="116" rx="14" fill="#0f2523" stroke="#1d5a52"/>
  <rect x="60" y="406" width="5" height="116" rx="2.5" fill="#34d6bd"/>
  <text x="88" y="440" class="mono" font-size="14.5" fill="#86ecdb">[OpenBot report] agent: Ada · request: inbox-1 · outcome: completed</text>
  <text x="88" y="474" class="msg">12 new emails. Two need a reply today: the invoice from Northwind and</text>
  <text x="88" y="500" class="msg">the review request from Priya. The rest are newsletters and receipts.</text>
</svg>
