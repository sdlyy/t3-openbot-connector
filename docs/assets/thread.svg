<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A T3 Code thread: the user asks for an OpenBot agent, the T3 agent queues the task and ends its turn, and the tagged report arrives as a new message.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .msg { font-size: 15.5px; fill: #f1f3f7; }
    .dim { font-size: 13px; fill: #a3a3a3; }
    .bar { font-size: 13.5px; font-weight: 500; fill: #f1f3f7; }
  </style>
  <rect width="1200" height="600" rx="16" fill="#000"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".12"/>

  <!-- top bar -->
  <circle cx="34" cy="26" r="5.5" fill="#fff" fill-opacity=".14"/><circle cx="54" cy="26" r="5.5" fill="#fff" fill-opacity=".14"/><circle cx="74" cy="26" r="5.5" fill="#fff" fill-opacity=".14"/>
  <text x="600" y="31" text-anchor="middle" class="bar">Summarise today's inbox</text>
  <line x1="0" y1="52.5" x2="1200" y2="52.5" stroke="#fff" stroke-opacity=".08"/>

  <!-- chat column: 736px wide, x 232..968 -->
  <!-- user -->
  <rect x="574.5" y="88.5" width="394" height="46" rx="16" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".08"/>
  <text x="594" y="117" class="msg">Ask Ada in OpenBot to summarise today's inbox.</text>

  <!-- tool row -->
  <path d="M240 180l4 4 -4 4" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="256" y="188.5" class="dim">Called</text>
  <text x="300" y="188.5" class="mono" font-size="12.5" fill="#d4d4d4">t3_openbot · send_message</text>
  <rect x="504.5" y="173.5" width="66" height="22" rx="11" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/>
  <text x="537.5" y="188.5" text-anchor="middle" class="dim" font-size="12">queued</text>

  <!-- assistant -->
  <text x="232" y="228" class="msg">Queued with Ada. The answer will arrive in this thread.</text>

  <!-- divider -->
  <line x1="232" y1="280.5" x2="536" y2="280.5" stroke="#fff" stroke-opacity=".08"/>
  <text x="600" y="285" text-anchor="middle" class="dim">a moment later</text>
  <line x1="664" y1="280.5" x2="968" y2="280.5" stroke="#fff" stroke-opacity=".08"/>

  <!-- report bubble (arrives as a message in the thread) -->
  <rect x="318.5" y="320.5" width="650" height="150" rx="16" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="344" cy="350" r="4" fill="#00bc7d"/>
  <text x="356" y="354.5" class="mono" font-size="12.5" fill="#00d492">[OpenBot report] agent: Ada · request: inbox-1 · outcome: completed</text>
  <line x1="338" y1="372.5" x2="949" y2="372.5" stroke="#fff" stroke-opacity=".06"/>
  <text x="338" y="402" class="msg">12 new emails. Two need a reply today: the invoice from Northwind</text>
  <text x="338" y="426" class="msg">and the review request from Priya. The rest are newsletters</text>
  <text x="338" y="450" class="msg">and receipts.</text>

  <!-- composer -->
  <rect x="232.5" y="512.5" width="736" height="52" rx="16" fill="#111" stroke="#fff" stroke-opacity=".12"/>
  <text x="254" y="544" class="msg" style="fill:#737373">Ask anything</text>
  <circle cx="940" cy="538.5" r="14" fill="#346bf1"/>
  <path d="M940 544.5v-12m-5 5l5-5 5 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
