<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="A T3 Code thread sends a task through the connector to an OpenBot agent, and the agent posts its report back into the same thread.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111726"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <marker id="a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9d8cff"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b84a"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d6bd"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 23px; font-weight: 650; fill: #eef1f7; }
    .sub { font-size: 14.5px; fill: #8d97ab; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; fill: #6f7a90; }
    .lbl { font-size: 13.5px; fill: #c3cad8; }
    .num { font-size: 13px; font-weight: 700; fill: #0b0f1a; }
    .chip { font-size: 13px; fill: #c3cad8; }
  </style>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="23.5" fill="none" stroke="#242c3d"/>
  <text x="60" y="66" class="eyebrow">ONE ROUND TRIP</text>

  <!-- T3 Code -->
  <rect x="60" y="120" width="280" height="170" rx="16" fill="#171d2c" stroke="#3b3470"/>
  <rect x="60" y="120" width="280" height="5" rx="2.5" fill="#9d8cff"/>
  <text x="84" y="168" class="title">T3 Code thread</text>
  <text x="84" y="194" class="sub">Codex or Claude agent</text>
  <rect x="84" y="226" width="130" height="34" rx="8" fill="#211d3d" stroke="#3b3470"/>
  <text x="149" y="248" text-anchor="middle" class="mono" font-size="13.5" fill="#bdb2ff">send_message</text>

  <!-- Connector -->
  <rect x="490" y="120" width="220" height="170" rx="16" fill="#171d2c" stroke="#5e4a1f"/>
  <rect x="490" y="120" width="220" height="5" rx="2.5" fill="#f5b84a"/>
  <text x="514" y="168" class="title">Connector</text>
  <text x="514" y="194" class="sub">stdio MCP server</text>
  <rect x="514" y="226" width="112" height="34" rx="8" fill="#2b2313" stroke="#5e4a1f"/>
  <text x="570" y="248" text-anchor="middle" class="mono" font-size="13.5" fill="#f8cf85">stateless</text>

  <!-- OpenBot -->
  <rect x="860" y="120" width="280" height="170" rx="16" fill="#171d2c" stroke="#1d5a52"/>
  <rect x="860" y="120" width="280" height="5" rx="2.5" fill="#34d6bd"/>
  <text x="884" y="168" class="title">OpenBot agent</text>
  <text x="884" y="194" class="sub">Browser, accounts, routines</text>
  <rect x="884" y="226" width="140" height="34" rx="8" fill="#10302d" stroke="#1d5a52"/>
  <text x="954" y="248" text-anchor="middle" class="mono" font-size="13.5" fill="#86ecdb">t3_thread_send</text>

  <!-- arrow 1 -->
  <line x1="348" y1="205" x2="480" y2="205" stroke="#9d8cff" stroke-width="2.5" marker-end="url(#a-violet)"/>
  <circle cx="415" cy="170" r="12" fill="#9d8cff"/><text x="415" y="174.5" text-anchor="middle" class="num">1</text>
  <text x="415" y="232" text-anchor="middle" class="lbl">stdio MCP</text>

  <!-- arrow 2 -->
  <line x1="718" y1="205" x2="850" y2="205" stroke="#f5b84a" stroke-width="2.5" marker-end="url(#a-amber)"/>
  <circle cx="785" cy="170" r="12" fill="#f5b84a"/><text x="785" y="174.5" text-anchor="middle" class="num">2</text>
  <text x="785" y="232" text-anchor="middle" class="lbl">Local scripts API</text>

  <!-- return arrow -->
  <path d="M1000 298 V352 Q1000 372 980 372 H220 Q200 372 200 352 V302" fill="none" stroke="#34d6bd" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-teal)"/>
  <rect x="352" y="353" width="496" height="38" rx="19" fill="#10302d" stroke="#1d5a52"/>
  <circle cx="378" cy="372" r="12" fill="#34d6bd"/><text x="378" y="376.5" text-anchor="middle" class="num">3</text>
  <text x="400" y="377" class="lbl" fill="#c9f5ee">Report posted through T3 Code's own MCP endpoint</text>

  <!-- chips -->
  <g transform="translate(60 432)">
    <rect width="96" height="32" rx="16" fill="#171d2c" stroke="#2a3347"/><text x="48" y="21" text-anchor="middle" class="chip">No state</text>
    <rect x="108" width="124" height="32" rx="16" fill="#171d2c" stroke="#2a3347"/><text x="170" y="21" text-anchor="middle" class="chip">No open port</text>
    <rect x="244" width="196" height="32" rx="16" fill="#171d2c" stroke="#2a3347"/><text x="342" y="21" text-anchor="middle" class="chip">No credential of its own</text>
    <rect x="452" width="238" height="32" rx="16" fill="#171d2c" stroke="#2a3347"/><text x="571" y="21" text-anchor="middle" class="chip">Works with both apps as shipped</text>
  </g>
</svg>
