<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="A T3 Code thread sends a task through the connector to an OpenBot agent, and the agent posts its report back into the same thread.">
  <defs>
    <marker id="a-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3a3a3"/></marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00bc7d"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 19px; font-weight: 600; fill: #f1f3f7; }
    .sub { font-size: 14px; fill: #a3a3a3; }
    .lbl { font-size: 13px; fill: #a3a3a3; }
    .num { font-size: 12px; font-weight: 600; fill: #f1f3f7; }
    .code { font-size: 12.5px; fill: #d4d4d4; }
    .chip { font-size: 12.5px; font-weight: 500; fill: #a3a3a3; }
  </style>
  <rect width="1200" height="470" rx="16" fill="#000"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".12"/>

  <!-- T3 Code -->
  <rect x="60.5" y="80.5" width="280" height="150" rx="12" fill="#111" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="88" cy="118" r="4.5" fill="#346bf1"/>
  <text x="102" y="124" class="title">T3 Code thread</text>
  <text x="84" y="152" class="sub">Codex or Claude agent</text>
  <rect x="84.5" y="178.5" width="118" height="28" rx="6" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/>
  <text x="143.5" y="197" text-anchor="middle" class="mono code">send_message</text>

  <!-- Connector -->
  <rect x="490.5" y="80.5" width="220" height="150" rx="12" fill="#111" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="518" cy="118" r="4.5" fill="#f1f3f7"/>
  <text x="532" y="124" class="title">Connector</text>
  <text x="514" y="152" class="sub">stdio MCP server</text>
  <rect x="514.5" y="178.5" width="92" height="28" rx="6" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/>
  <text x="560.5" y="197" text-anchor="middle" class="mono code">stateless</text>

  <!-- OpenBot -->
  <rect x="860.5" y="80.5" width="280" height="150" rx="12" fill="#111" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="888" cy="118" r="4.5" fill="#00bc7d"/>
  <text x="902" y="124" class="title">OpenBot agent</text>
  <text x="884" y="152" class="sub">Browser, accounts, routines</text>
  <rect x="884.5" y="178.5" width="132" height="28" rx="6" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/>
  <text x="950.5" y="197" text-anchor="middle" class="mono code">t3_thread_send</text>

  <!-- arrow 1 -->
  <line x1="350" y1="155" x2="480" y2="155" stroke="#a3a3a3" stroke-width="1.5" marker-end="url(#a-fg)"/>
  <rect x="404" y="116" width="22" height="22" rx="11" fill="#346bf1"/><text x="415" y="131.5" text-anchor="middle" class="num">1</text>
  <text x="415" y="180" text-anchor="middle" class="lbl">stdio MCP</text>

  <!-- arrow 2 -->
  <line x1="720" y1="155" x2="850" y2="155" stroke="#a3a3a3" stroke-width="1.5" marker-end="url(#a-fg)"/>
  <rect x="774" y="116" width="22" height="22" rx="11" fill="#346bf1"/><text x="785" y="131.5" text-anchor="middle" class="num">2</text>
  <text x="785" y="180" text-anchor="middle" class="lbl">Local scripts API</text>

  <!-- return arrow -->
  <path d="M1000 238 V298 Q1000 314 984 314 H216 Q200 314 200 298 V242" fill="none" stroke="#00bc7d" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a-ok)"/>
  <rect x="362.5" y="297.5" width="476" height="34" rx="17" fill="#0b0b0b" stroke="#fff" stroke-opacity=".12"/>
  <rect x="372" y="303.5" width="22" height="22" rx="11" fill="#00bc7d"/><text x="383" y="319" text-anchor="middle" class="num" fill="#000" style="fill:#00140d">3</text>
  <text x="406" y="319.5" class="lbl" style="fill:#f1f3f7">Report posted through T3 Code's own MCP endpoint</text>

  <!-- chips -->
  <g transform="translate(60 386)">
    <rect x=".5" y=".5" width="88" height="28" rx="14" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".08"/><text x="44.5" y="19" text-anchor="middle" class="chip">No state</text>
    <rect x="100.5" y=".5" width="116" height="28" rx="14" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".08"/><text x="158.5" y="19" text-anchor="middle" class="chip">No open port</text>
    <rect x="228.5" y=".5" width="184" height="28" rx="14" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".08"/><text x="320.5" y="19" text-anchor="middle" class="chip">No credential of its own</text>
    <rect x="424.5" y=".5" width="226" height="28" rx="14" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".08"/><text x="537.5" y="19" text-anchor="middle" class="chip">Works with both apps as shipped</text>
  </g>
</svg>
